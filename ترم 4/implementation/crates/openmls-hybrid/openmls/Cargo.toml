[package]
name = "openmls-hybrid"
version = "0.8.1"
authors = ["OpenMLS Authors"]
edition = "2021"
description = "A Rust implementation of the Messaging Layer Security (MLS) protocol, as defined in RFC 9420."
license = "MIT"
documentation = "https://docs.rs/openmls"
repository = "https://github.com/openmls/openmls/"
readme = "../README.md"
keywords = ["MLS", "IETF", "RFC9420", "Encryption", "E2EE"]
exclude = ["/test_vectors"]

[dependencies]
openmls_traits = { path = "../traits", version = "0.5.0" }
openmls_rust_crypto = { path = "../openmls_rust_crypto", version = "0.5.1", optional = true }

serde = { version = "^1.0", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
tls_codec = { version = "0.4.2", features = ["derive", "serde", "mls"] }
rayon = "^1.5.0"
thiserror = "^2.0"
zeroize = "1.8.1"
serde_bytes = "0.11.17"

[features]
experimental-hybrid = []
test-utils = []
backtrace = []
libcrux-provider = []
sqlite-provider = []
crypto-debug = [] # ☣️ Enable logging of sensitive cryptographic information
content-debug = [] # ☣️ Enable logging of sensitive message content
js = []
js-test = []
extensions-draft-08 = []
fork-resolution = []
