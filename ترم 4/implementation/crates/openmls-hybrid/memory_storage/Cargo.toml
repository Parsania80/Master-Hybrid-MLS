[package]
name = "openmls_memory_storage"
authors = ["OpenMLS Authors"]
version = "0.5.0"
edition = "2021"
description = "A very basic storage for OpenMLS implementing openmls_traits."
license = "MIT"
documentation = "https://docs.rs/openmls_memory_storage"
repository = "https://github.com/openmls/openmls/tree/main/memory_storage"
readme = "README.md"

[dependencies]
openmls_traits = { path = "../traits", version = "0.5.0" }

thiserror = "2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4" }

[features]
test-utils = []
transaction-test-utils = []
persistence = []
extensions-draft-08 = []
