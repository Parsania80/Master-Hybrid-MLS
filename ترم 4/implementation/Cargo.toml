[workspace]
members = [
    ".",
    "crates/adaptive-tree",
    "crates/arity-state",
    "crates/experiment-config",
    "crates/experimental-mls-adapter",
    "crates/hybrid-path-secret",
    "crates/metrics",
    "crates/mkyber",
    "crates/mls-adapter",
    "crates/report",
    "crates/simulation",
    "crates/transition-auth",
    "crates/transition-tree",
    "crates/transition-policy",
]
exclude = ["crates/openmls-hybrid"]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.93.1"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "=0.10.3"
clap = { version = "=4.6.2", features = ["derive"] }
csv = "=1.4.0"
hex = "=0.4.3"
hkdf = "=0.12.4"
openmls = { version = "=0.8.1", default-features = false, features = ["openmls_rust_crypto"] }
openmls-hybrid = { package = "openmls-hybrid", path = "crates/openmls-hybrid/openmls", default-features = false, features = ["openmls_rust_crypto", "experimental-hybrid"] }
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
proptest = "=1.11.0"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tls_codec = { version = "=0.4.2", features = ["derive", "mls"] }
toml = "=1.1.3"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "adaptive-hybrid-mls"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
csv.workspace = true
hex.workspace = true
mls-adapter = { path = "crates/mls-adapter" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
