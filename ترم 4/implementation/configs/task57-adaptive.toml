# Task 57 public adaptive comparison configuration. The selected mode is not executable until authenticated transition support exists in an OpenMLS fork.
mode = "adaptive-binary-to-quaternary-mls"

[group]
target_group_size = 4
current_arity = 2
candidate_arity = 4

[transition]
window_accepted_commits = 2
stable_epoch_count = 1
q_min = 1
theta_new_micro = 700000
theta_old_micro = 500000
delta_bytes = 1

[execution]
warmup_accepted_commits = 1
repetitions = 2
workload_seed = 57

[output]
output_directory = "output/task57-comparison"
report_directory = "report/task57-comparison"
