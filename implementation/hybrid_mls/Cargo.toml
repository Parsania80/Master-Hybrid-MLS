[package]
name = "hybrid_mls"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Crypto
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
ml-kem = "0.3.0-rc.0"
kem = "0.3.0-rc.6"  # Added this to access crypto traits
rand = "0.8"
rand_core = "0.10"
sha3 = "0.10"
chacha20poly1305 = "0.10"

# Security & Utils
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
ed25519-dalek = "2.2.0"
ml-dsa = "0.0.4"
